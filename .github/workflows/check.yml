# check.sh sudah menyatukan semua cek jadi satu perintah, tapi tak ada yang
# menjalankannya kecuali kalau diingat. Ini yang mengingatkan.
#
# Tanpa Docker: image-nya cuma perlu dibangun ulang tiap kali, sementara
# opencv-python-headless memang dipilih supaya jalan di mesin tanpa GUI.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v4/v5 masih menargetkan Node 20 yang sudah usang: jalan, tapi mencetak
      # peringatan deprecation di SETIAP kali CI jalan — persis kebiasaan yang
      # dijaga check.sh supaya tidak tumbuh. v7 keduanya sudah node24.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ./check.sh
