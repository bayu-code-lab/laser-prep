services:
  laser-prep:
    build: .
    container_name: laser-prep
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # mount source -> perubahan langsung terlihat (hot reload)
    tmpfs:
      - /app/_out  # hasil proses hidup di RAM saja: tidak pernah nyentuh disk host, hilang saat container mati
    # --reload: uvicorn watch app.py & prep/, restart otomatis tiap file berubah.
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
